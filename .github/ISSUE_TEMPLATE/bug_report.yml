name: Bug report
description: Report unexpected Sponskip behavior without sharing private browsing data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private or unlisted video URLs, account data, cookies, or credentials."
  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Sponskip version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional console errors
